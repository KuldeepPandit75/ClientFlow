name: Verify application

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/next-automation-build
          AUTH_SECRET: github-build-only-secret
          CRON_SECRET: github-build-only-cron-secret
